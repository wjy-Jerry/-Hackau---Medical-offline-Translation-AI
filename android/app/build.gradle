plugins {
    id 'com.android.application'
}

android {
    namespace 'org.fieldtalk.backup'
    compileSdk 35

    defaultConfig {
        applicationId 'org.fieldtalk.backup'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main.assets.srcDirs += ['../../data/phrase_packs']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
}
